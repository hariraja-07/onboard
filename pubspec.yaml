name: onboard
description: College Bus Attendance - local-first barcode scanning attendance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.3
  path_provider: ^2.1.2
  path: ^1.9.0

  # Navigation
  go_router: ^14.0.2

  # Barcode / QR scanner
  mobile_scanner: ^4.0.0

  # Excel / XLSX import and export
  excel_community: ^2.4.2

  # Native file picker (also used for save-as downloads)
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true